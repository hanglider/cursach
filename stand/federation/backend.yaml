# Долгоживущий backend тестового сервиса, один на кластер (ADR 0014).
# Именно его поды — цель NetworkChaos в сценарии 2 (ADR 0016).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workloads
  labels:
    app.kubernetes.io/name: test-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-service
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: federation/test-service:dev
          imagePullPolicy: Never  # образ загружен через kind load, registry нет
          args: ["--role=backend"]
          env:
            # Трейсы — в коллектор своего кластера (ADR 0029); пусто — трассировка выключена.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4318
          ports:
            - name: http
              containerPort: 8080
          # Таймауты проб — с запасом под netem сценария 2 (ADR 0037): 500 мс на каждый
          # исходящий пакет backend'а и потери 10% дают пробе ≥ 1 с и ретрансмиссии TCP.
          # С таймаутом 1 с по умолчанию kubelet убивал медленный, но живой backend,
          # и CrashLoopBackOff держал его лежащим до 160 с после снятия отказа.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: workloads
  labels:
    app.kubernetes.io/name: test-service
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: test-service
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
