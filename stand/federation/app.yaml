# Долгоживущий сервис app — объект переключения трафика и цель пробы DR (ADR 0011).
# Тот же frontend, что и в потоке workload'ов, но с двумя репликами и
# фиксированным NodePort 31998; маршрут app.fed.local с весами по кластерам
# создаёт stand/scripts/render-app-route.sh в control.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: workloads
  labels:
    app.kubernetes.io/name: test-service
    app.kubernetes.io/component: frontend
    federation.spbu/workload: app
spec:
  replicas: 2
  selector:
    matchLabels:
      federation.spbu/workload: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-service
        app.kubernetes.io/component: frontend
        federation.spbu/workload: app
    spec:
      containers:
        - name: frontend
          image: federation/test-service:dev
          imagePullPolicy: Never
          args: ["--role=frontend"]
          env:
            - name: WORKLOAD
              value: app
            - name: BACKEND_URL
              value: http://backend.workloads.svc:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: workloads
  labels:
    app.kubernetes.io/name: test-service
    app.kubernetes.io/component: frontend
    federation.spbu/workload: app
spec:
  type: NodePort
  selector:
    federation.spbu/workload: app
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31998
