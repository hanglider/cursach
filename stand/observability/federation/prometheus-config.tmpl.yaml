# Шаблон конфигурации Prometheus кластера федерации. __CLUSTER_ID__ подставляет
# stand/scripts/render-prometheus-config.sh из stand/clusters.yaml.
# external_labels.cluster — то, по чему Thanos Querier различает источники
# (architecture §2.3); внутри самого Prometheus этой метки у рядов нет.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s      # TTD < 60 с требует разрешения лучше 15 с
      evaluation_interval: 5s
      external_labels:
        cluster: __CLUSTER_ID__
    rule_files:
      - /etc/prometheus/rules/*.yaml
      - /etc/prometheus/capacity/*.yaml   # ёмкость узлов, рендерится при stand-up
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      # Тестовый сервис: backend, app и frontend'ы потока (ADR 0014, 0015).
      - job_name: test-service
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [workloads]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_federation_spbu_workload]
            target_label: workload
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # cAdvisor через прокси API-сервера: saturation (architecture §2.3).
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # Только то, что нужно для saturation; остальное — кардинальность впустую.
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
            action: keep
          # Корневая cgroup узла (id="/") и cgroup'ы подов; в kind они под /kubelet.slice.
          - source_labels: [id]
            regex: /|/kubelet\.slice/.*
            action: keep
