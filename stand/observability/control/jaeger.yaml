# Jaeger v2 в control (spec §7, ADR 0029): приёмник OTLP и хранилище трейсов вне
# федерации (инвариант 1). Спаны шлют шлюз control (Envoy, корень трейса) и
# OTel Collector'ы кластеров федерации. Хранилище в памяти, ограничено max_traces:
# долгосрочное хранение — экспорт трейсов прогона в experiments/results (как у рядов,
# ADR 0002), поэтому рестарт Jaeger теряет только то, что ещё не выгружено.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: observability
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: basic
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
        logs:
          level: info
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: memstore
        http:
          endpoint: 0.0.0.0:16686
        grpc:
          endpoint: 0.0.0.0:16685
      jaeger_storage:
        backends:
          memstore:
            memory:
              # ~4 тыс. трейсов на 13-минутный прогон при сэмплинге 10% и 50 RPS:
              # хватает на несколько прогонов, память ограничена (ADR 0013).
              max_traces: 20000
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter:
        trace_storage: memstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
      annotations:
        # Смена конфига — новый под (хранилище в памяти всё равно одно на под).
        federation.spbu/config-version: "1"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          args: ["--config=file:/etc/jaeger/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
# Внутри control: шлюз (EnvoyProxy telemetry.tracing), Grafana, скрейп метрик.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
    - name: metrics
      port: 8888
      targetPort: metrics
---
# Наружу: UI на хост 16686 (порт проброшен kind заранее, ADR 0025) и OTLP gRPC для
# коллекторов федерации по IP узла control (ADR 0021, 0022).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeport
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      nodePort: 30686
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      nodePort: 30417
