# Prometheus control-кластера (ADR 0008, 0024): принимает remote write от k6,
# скрейпит метрики Envoy (бонусный клиентский ряд, не источник SLI — ADR 0016),
# компоненты Thanos и DR Controller. Через свой sidecar виден Querier'у как cluster=control.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        cluster: control
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      - job_name: thanos
        static_configs:
          - targets:
              - localhost:10902
              - thanos-query.observability.svc:10902
              - thanos-rule.observability.svc:10902

      - job_name: grafana
        static_configs:
          - targets: [grafana.observability.svc:3000]

      # DR Controller (ADR 0028): состояние автомата, сигналы и веса маршрута app.
      - job_name: dr-controller
        static_configs:
          - targets: [dr-controller.federation.svc:8080]

      # Прокси Envoy Gateway: per-upstream счётчики и гистограммы.
      - job_name: envoy
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [envoy-gateway-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_name]
            regex: stand
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: envoy_cluster_upstream_rq_(total|completed|xx|time_bucket|time_count|time_sum)|envoy_http_downstream_rq_(total|xx)
            action: keep
