# Права DR Controller'а в control (ADR 0017, 0028): чтение Backend'ов и правка весов
# HTTPRoute app на шлюзе. В кластеры федерации он ходит только HTTP-пробами; kubeconfig'и
# из Secret'а federation-kubeconfigs нужны ему лишь ради CA API-серверов (api_ok).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-controller
  namespace: federation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-controller
  namespace: gateway
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, update]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [backends]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-controller
  namespace: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dr-controller
subjects:
  - kind: ServiceAccount
    name: dr-controller
    namespace: federation
