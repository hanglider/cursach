# Control-кластер: управляющий контур (ADR 0001). В федерацию не входит.
# Один узел: control-plane без taint принимает поды, как делает kind по умолчанию.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: control
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # NodePort шлюза Envoy Gateway (stand/gateway/gateway.yaml) -> хост.
      # k6 и генератор workload'ов ходят в http://127.0.0.1:8080 (ADR 0017).
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Prometheus control: remote write от k6 (ADR 0008).
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # Thanos Querier: экспорт результатов и ручные запросы (ADR 0002).
      - containerPort: 30902
        hostPort: 10902
        protocol: TCP
      # Grafana.
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # Каталог кластеров: регистрация из up.sh, экспорт решений, ручные запросы (ADR 0025).
      - containerPort: 30800
        hostPort: 8000
        protocol: TCP
      # Jaeger UI (задача 3): порт зарезервирован, чтобы не пересоздавать кластер второй раз.
      - containerPort: 30686
        hostPort: 16686
        protocol: TCP
