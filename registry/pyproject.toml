[project]
name = "registry"
version = "0.1.0"
description = "Федеративный каталог кластеров (spec §4.3, ADR 0004, 0018, 0025)"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.27",
  "kubernetes>=31",
  "pydantic>=2.8",
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
